---
name: "Player finishes without answering"
description: >
  A connected player does not answer any question and still receives final
  results with a zero score and an empty result list.

quiz:
  name: Quiz without player answers
  questions:
    - text: "Question nobody answers"
      type: single_choice
      options:
        - answer: "A"
          correct: true
        - answer: "B"
          correct: false

actors:
  admin:
    role: admin
  alice:
    role: client

steps:
  - actor: admin
    action: connect
  - actor: admin
    action: expect
    contains: "Admin for the quiz"

  - actor: alice
    action: connect
  - actor: alice
    action: expect
    json:
      text: "Quiz without player answers"
  - actor: alice
    action: expect
    contains: "Check your name"
  - actor: admin
    action: expect
    contains: "player alice connected"

  # Run through the question without Alice submitting an answer.
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: alice
    action: expect
    json:
      type: question
      text: "Question nobody answers"
  - actor: admin
    action: expect
    json:
      type: question
      text: "Question nobody answers"
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: admin
    action: expect
    json:
      type: question_result
      correct_answer: "a"
  - actor: alice
    action: expect
    json:
      type: question_result
      correct_answer: "a"
      correct: null

  # End the quiz and verify the player receives empty personal results.
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: admin
    action: expect
    json:
      type: final_scores
      scores:
        - player: alice
          correct_count: 0
  - actor: alice
    action: expect
    json:
      type: final_results
      correct_count: 0
      results: []
