---
name: "Two players answer different questions"
description: >
  Alice answers the first question and Bob answers the second. Verify that each
  player's final results contain only their own answer, in question order.

quiz_file: quiz.yaml

actors:
  admin:
    role: admin
  alice:
    role: client
  bob:
    role: client

steps:
  # --- Admin connects ---
  - actor: admin
    action: connect
  - actor: admin
    action: expect
    contains: "Admin for the quiz"

  # --- Alice connects ---
  - actor: alice
    action: connect
  - actor: alice
    action: expect
    json:
      text: "Simple example quiz to show how does it work"
  - actor: alice
    action: expect
    contains: "Check your name"
  - actor: admin
    action: expect
    contains: "player alice connected"

  # --- Bob connects ---
  - actor: bob
    action: connect
  - actor: bob
    action: expect
    json:
      text: "Simple example quiz to show how does it work"
  - actor: bob
    action: expect
    contains: "Check your name"
  - actor: admin
    action: expect
    contains: "player bob connected"

  # Alice answers question 1; Bob leaves it unanswered.
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: alice
    action: expect
    json:
      type: question
      text: "This question has one correct answer which is A"
  - actor: bob
    action: expect
    json:
      type: question
  - actor: admin
    action: expect
    json:
      type: question
  - actor: alice
    action: send
    data:
      client_id: alice
      answer: "a"
  - actor: alice
    action: expect
    json:
      type: repeat
      text: "a"

  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: admin
    action: expect
    json:
      type: question_result
      correct_answer: "a"
  - actor: alice
    action: expect
    json:
      type: question_result
      correct_answer: "a"
      correct: true
  - actor: bob
    action: expect
    json:
      type: question_result
      correct_answer: "a"
      correct: null

  # Bob answers question 2 incorrectly; Alice leaves it unanswered.
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: alice
    action: expect
    json:
      type: question
      text: "This question has one correct answer which is B"
  - actor: bob
    action: expect
    json:
      type: question
      text: "This question has one correct answer which is B"
  - actor: admin
    action: expect
    json:
      type: question
      text: "This question has one correct answer which is B"
  - actor: bob
    action: send
    data:
      client_id: bob
      answer: "a"
  - actor: bob
    action: expect
    json:
      type: repeat
      text: "a"

  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: admin
    action: expect
    json:
      type: question_result
      correct_answer: "b"
  - actor: alice
    action: expect
    json:
      type: question_result
      correct_answer: "b"
      correct: null
  - actor: bob
    action: expect
    json:
      type: question_result
      correct_answer: "b"
      correct: false

  # Each final result must contain only that player's answer.
  - actor: admin
    action: send
    data: {"type": "next_step"}
  - actor: admin
    action: expect
    json:
      type: final_scores
      scores:
        - player: alice
          correct_count: 1
        - player: bob
          correct_count: 0
  - actor: alice
    action: expect
    json:
      type: final_results
      correct_count: 1
      results:
        - question_number: 0
          answer: a
          correct: true
  - actor: bob
    action: expect
    json:
      type: final_results
      correct_count: 0
      results:
        - question_number: 1
          answer: a
          correct: false
